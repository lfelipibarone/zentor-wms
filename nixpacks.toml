# Fallback se alguma app no Dokploy ainda usar Nixpacks.
# Preferência: build Docker (apps/api/Dockerfile, apps/web/Dockerfile).
# Nixpacks no frontend engorda a imagem (copia o monorepo) e o deploy fica
# amarelo em "exporting/unpacking layers". Use Dockerfile no Dokploy.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.0 --activate",
  "pnpm install --frozen-lockfile --filter @wms/api... --filter @wms/web... --filter @wms/shared..."
]

[phases.build]
cmds = [
  "pnpm --filter @wms/shared build",
  "pnpm --filter @wms/api db:generate",
  "pnpm --filter @wms/api build"
]

[start]
cmd = "pnpm --filter @wms/api start:homolog"
