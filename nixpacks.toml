# Fallback quando Dokploy usa Nixpacks (monorepo pnpm).
# Cada app deve sobrescrever build/start via env NIXPACKS_* no Dokploy.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.0 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @wms/shared build",
  "pnpm --filter @wms/api db:generate",
  "pnpm --filter @wms/api build"
]

[start]
cmd = "node apps/api/dist/index.js"
