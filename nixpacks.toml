# Fallback se alguma app no Dokploy ainda usar Nixpacks.
# Preferência do time: build Docker (apps/api/Dockerfile, apps/web/Dockerfile).

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.0 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @wms/shared build",
  "pnpm --filter @wms/api db:generate",
  "pnpm --filter @wms/api build"
]

[start]
cmd = "pnpm --filter @wms/api start:homolog"
